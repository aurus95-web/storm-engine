name: CI Linux

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - '*.md'

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v3.4.1
        with:
          # skip concurrent jobs if they are on the same thing
          concurrent_skipping: 'same_content'
          # never skip PR, release or manual/scheduled runs
          do_not_skip: '["pull_request", "release", "workflow_dispatch", "schedule"]'

  build-linux:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug]
    name: 'linux [${{ matrix.configuration}}]'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install libs
      run: |
        sudo apt-get update
        sudo apt-get install -y clang ninja-build meson glslang-tools libvulkan-dev libffi-dev zlib1g-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxxf86vm-dev \
          libwayland-dev libxkbcommon-dev libegl-dev libgl-dev libasound2-dev libpulse-dev
    # third-party dependencies are fetched from git (STORM_USE_CONAN=OFF), same as on macOS/iOS
    - name: Configure with cmake
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} \
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
          -DSTORM_USE_CONAN=OFF -DSTORM_FETCH_SDL=ON
    - name: Build dependencies
      run: ninja dependencies
      working-directory: build
    - name: Build project and run tests
      run: ninja
      working-directory: build
